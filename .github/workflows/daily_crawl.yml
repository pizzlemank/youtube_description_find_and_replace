name: Daily Trends Crawl

on:
  schedule:
    - cron: '0 0 * * *' # Run at midnight every day
  workflow_dispatch: # Allow manual triggering

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pytrends pandas; fi

      - name: Run crawler
        run: python crawl_trends.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add trends.md
          git commit -m "Automated daily trends update [skip ci]" || echo "No changes to commit"
          git push
