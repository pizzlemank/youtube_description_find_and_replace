name: Daily Google Trends POD Crawl

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytrends pandas requests

      - name: Run Google Trends Crawler
        run: |
          python crawl_trends.py

      - name: Commit and push updated trends.md
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trends.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update trends.md with daily Google Trends crawl" && git push)
