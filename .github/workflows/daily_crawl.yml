name: Daily Google Trends Merch Crawl

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytrends pandas requests

      - name: Run Trends Crawler
        run: |
          python crawl_trends.py

      - name: Commit and push trends update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add trends.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update trends.md [daily crawl]" && git push)
